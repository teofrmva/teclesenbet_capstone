
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- This sets up the About page.
         It makes the page work on different screen sizes
         and connects it to the shared stylesheet. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | Fitness Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- This is the shared sticky header.
         It shows the Fitness Hub logo and navigation.
         The same header is used on every page. -->
    <header class="site-header">
        <a href="index.html" class="logo" aria-label="Fitness Hub Home">
            <svg width="48" height="48" viewBox="0 0 48 48"
                 role="img" aria-label="Fitness Hub logo">
                <circle cx="24" cy="24" r="21" fill="#f97316"></circle>
                <text x="24" y="30" text-anchor="middle"
                      fill="#111827" font-size="15"
                      font-weight="bold">FH</text>
            </svg>
            <span>Fitness Hub</span>
        </a>

        <!-- This button opens the mobile navigation.
             It helps phone users reach every page. -->
        <button class="menu-toggle" type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="main-navigation">
            &#9776;
        </button>

        <!-- This navigation connects all five pages.
             The links are the same throughout the website. -->
        <nav id="main-navigation" class="site-nav"
             aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html" aria-current="page">About</a>
            <a href="services.html">Services</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- This is the About page placeholder.
         The full story and values will be added later. -->
    <main class="features">
        <h1>About Fitness Hub</h1>
        <p>This page is coming soon.</p>
    </main>

    <!-- This is the shared footer.
         It provides copyright, contact information,
         and navigation on every page. -->
    <footer class="site-footer">
        <p>&copy; 2026 Fitness Hub. All rights reserved.</p>
        <p>Contact:
            <a href="mailto:hello@fitnesshub.example">
                hello@fitnesshub.example
            </a>
        </p>
        <nav class="footer-nav" aria-label="Footer navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </footer>

    <!-- This connects the shared JavaScript.
         It controls the hamburger navigation on phones. -->
    <script src="js/script.js"></script>
</body>
</html>
