
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- This sets up the Contact page.
         The viewport makes the layout responsive.
         The stylesheet applies the shared Fitness Hub design. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Fitness Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- This is the shared sticky header.
         It displays the logo and navigation links.
         Flexbox keeps the layout organized on desktop. -->
    <header class="site-header">
        <a href="index.html" class="logo" aria-label="Fitness Hub Home">
            <svg width="48" height="48" viewBox="0 0 48 48"
                 role="img" aria-label="Fitness Hub logo">
                <circle cx="24" cy="24" r="21" fill="#f97316"></circle>
                <text x="24" y="30" text-anchor="middle"
                      fill="#111827" font-size="15"
                      font-weight="bold">FH</text>
            </svg>
            <span>Fitness Hub</span>
        </a>

        <!-- This is the hamburger button for mobile screens.
             JavaScript opens and closes the navigation.
             This makes the links accessible on smaller devices. -->
        <button class="menu-toggle" type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="main-navigation">
            &#9776;
        </button>

        <!-- This navigation links all five pages.
             Contact is marked as the current page.
             The links match the rest of the website. -->
        <nav id="main-navigation" class="site-nav"
             aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>

    <!-- This is the Contact page placeholder.
         It tells visitors where the contact form will go.
         The complete form will be added in a later assignment. -->
    <main class="features">
        <h1>Contact Fitness Hub</h1>
        <p>This page is coming soon.</p>
    </main>

    <!-- This is the shared footer.
         It provides contact details and navigation links.
         The same footer appears throughout the website. -->
    <footer class="site-footer">
        <p>&copy; 2026 Fitness Hub. All rights reserved.</p>
        <p>
            Contact:
            <a href="mailto:hello@fitnesshub.example">
                hello@fitnesshub.example
            </a>
        </p>
        <nav class="footer-nav" aria-label="Footer navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </footer>

    <!-- This loads the shared JavaScript.
         It allows the hamburger menu to work on phones. -->
    <script src="js/script.js"></script>
</body>
</html>
